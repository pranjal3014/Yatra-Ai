spring.application.name=yatra-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/yatra_ai
spring.datasource.username=root
spring.datasource.password=root

# JPA / HIBERNATE

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# JWT CONFIGURATION

jwt.secret=ThisIsMyVerySecretKeyForYatraProject123456789ThisIsMySuperSecretKeyForYatraTripPlannerProjectAuthenticationJWT2026SpringBootSec89ABCDEFGHIJKLMNOPQRSTUVWXYZ
jwt.expiration=86400000